<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sow-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="hub-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="120" height="120" rx="28" fill="url(#sow-icon-bg)" />
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Outer Wheel Orbit Ring -->
  <circle cx="60" cy="60" r="40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="190 60" opacity="0.9" />
  
  <!-- Center Automotive Hub -->
  <g filter="url(#hub-shadow)">
    <circle cx="60" cy="60" r="24" fill="#FFFFFF" />
    <!-- Spokes -->
    <path d="M60 42V51M60 69V78M42 60H51M69 60H78" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="60" cy="60" r="7.5" fill="#10B981" />
  </g>
  
  <!-- Dynamic Orbital Satellite Indicator -->
  <circle cx="95" cy="45" r="5" fill="#FFFFFF" />
</svg>
