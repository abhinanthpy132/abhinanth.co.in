<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="sow-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#11B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sow-ring-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- SOW Automotive Wheel / Orbit Glyph -->
  <g transform="translate(4, 4)">
    <!-- Outer Orbit Ring -->
    <circle cx="24" cy="24" r="22" stroke="url(#sow-emerald-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 30" opacity="0.95" />
    
    <!-- Central Hub Circle -->
    <circle cx="24" cy="24" r="14" fill="url(#sow-emerald-grad)" />
    <circle cx="24" cy="24" r="14" fill="#111111" opacity="0.08" />
    
    <!-- Kinetic Vehicle Spokes -->
    <path d="M24 13V18M24 30V35M13 24H18M30 24H35" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="24" cy="24" r="4.5" fill="#FFFFFF" />
    <circle cx="24" cy="24" r="2" fill="#11B981" />
    
    <!-- Momentum Orbital Nodes -->
    <circle cx="43" cy="16" r="3" fill="#10B981" />
    <circle cx="6" cy="31" r="2" fill="#34D399" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(64, 33)">
    <!-- Primary SOW Wordmark -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="27" font-weight="900" letter-spacing="-0.04em" fill="#111111">SOW</text>
    
    <!-- Tagline Subscript -->
    <text x="70" y="-1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.22em" fill="#687177">SPARE ON WHEEL</text>
    <text x="70" y="9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="7" font-weight="600" letter-spacing="0.14em" fill="#11B981">VEHICLE ECOSYSTEM</text>
  </g>
</svg>
